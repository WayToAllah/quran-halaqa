<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تجربة عدّاد الأخطاء — المصحف</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:#f4f4f2;color:#1c1c1b}
.wrap{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:18px;font-weight:600;margin:0 0 4px}
.sub{font-size:13px;color:#6b6b66;margin:0 0 16px}
.card{background:#fff;border:1px solid #e2e0da;border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:#55554f;margin-bottom:6px}
select,input{width:100%;height:42px;font-size:16px;font-family:inherit;padding:0 10px;border:1px solid #d8d6cf;border-radius:8px;background:#fff}
.row{display:flex;gap:10px}.row>div{flex:1}
.go{width:100%;height:48px;margin-top:12px;font-size:16px;font-weight:600;font-family:inherit;color:#fff;background:#0f6e56;border:0;border-radius:10px}
.go:disabled{background:#b4b2a9}
.note{font-size:12px;color:#8a8a83;margin-top:10px;line-height:1.6}
#pages{font-size:13px;color:#0f6e56;margin-top:10px;min-height:20px}
/* viewer */
#viewer{position:fixed;inset:0;background:#fff9f1;display:none;flex-direction:column;z-index:50}
#viewer.on{display:flex}
.bar{display:flex;align-items:center;gap:10px;padding:7px 12px;background:#fff9f1;border-bottom:1px solid #efe3d3;padding-top:calc(10px + env(safe-area-inset-top))}
.bar .x{font-size:24px;line-height:1;background:0;border:0;color:#8a7256;padding:0 4px}
.bar .t{flex:1;min-width:0}
.bar .t b{display:block;font-size:14px;font-weight:600}
.bar .t span{display:block;font-size:12px;color:#8a7256;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .p{font-size:12px;color:#a98761;white-space:nowrap}
.stage{flex:1;position:relative;overflow:auto;display:flex;align-items:flex-start;justify-content:center}
.stage img{width:100%;max-width:520px;display:block}
.sheet{width:100%;max-width:520px;padding:2px 10px 6px;direction:rtl}
.ln{position:relative;white-space:nowrap;color:#1a1a1a}
.seg{position:absolute;top:0;white-space:nowrap;transform-origin:right center;direction:rtl;unicode-bidi:bidi-override}
.hdr{text-align:center;margin:0;line-height:1}
.hdr span{font-size:22px;color:#a98761;line-height:1.1;display:inline-block}
.bsm{text-align:center;line-height:1.75;color:#1a1a1a;white-space:nowrap}
.miss{padding:40px 24px;text-align:center;color:#993c1d;font-size:14px;line-height:1.8}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(255,252,246,.92);border:1px solid #e6d6c1;font-size:20px;color:#a98761}
.mush{display:flex;align-items:center;justify-content:space-between;padding:3px 16px 0;font-size:11.5px;font-weight:600;color:#b0906c;letter-spacing:.2px}
.pnumber{text-align:center;padding:0 0 8px;font-size:12px;font-weight:600;color:#b0906c}
.stage img,.sheet{transition:transform .18s ease,opacity .18s ease}
.stage.drag img,.stage.drag .sheet{transition:none}
.swipehint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(28,28,27,.78);color:#fff;font-size:12px;padding:5px 12px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .25s}
.swipehint.on{opacity:1}
.nav.r{right:6px}.nav.l{left:6px}
.undo{width:40px;height:40px;border-radius:50%;background:#fffdf9;border:1px solid #e6d6c1;font-size:19px;color:#55554f;flex:0 0 auto}
.add{flex:1;height:52px;border-radius:12px;background:#fcebeb;border:2px solid #e24b4a;color:#791f1f;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
.add b{font-size:24px;font-weight:600;line-height:1}
.add span{font-size:15px}
.add:active{transform:scale(.94)}
.foot{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff9f1;border-top:1px solid #efe3d3}
.hintbar{padding:0 12px 8px;font-size:12px;color:#8a7256;background:#fff9f1;text-align:center;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.foot #done{height:40px;padding:0 20px;font-size:15px;font-family:inherit;font-weight:600;color:#fff;background:#0f6e56;border:0;border-radius:8px}

</head>
<body>
<div class="wrap">
  <h1>تجربة عدّاد الأخطاء</h1>
  <p class="sub">نسخة تجريبية مستقلة — مش مربوطة بقاعدة البيانات ولا بتحفظ أي حاجة.</p>
  <div class="card">
    <label for="s">السورة</label>
    <select id="s"></select>
    <div class="row" style="margin-top:12px">
      <div><label for="f">من آية</label><input id="f" type="number" min="1" value="1" inputmode="numeric"></div>
      <div><label for="t">إلى آية</label><input id="t" type="number" min="1" value="7" inputmode="numeric"></div>
    </div>
    <div id="pages"></div>
    <button class="go" id="go">افتح الورد</button>
    <p class="note">المصحف كامل — ٦٠٤ صفحة. كل صفحة بتحمّل خطها أول مرة بس.</p>
  </div>
</div>

<div id="viewer">
  <div class="bar">
    <button class="x" id="close" aria-label="إغلاق">&times;</button>
    <div class="t"><b>زيد احمد</b><span id="ward"></span></div>
    <div class="p" id="pnum"></div>
  </div>
  <div class="mush"><span id="mjuz"></span><span id="msura"></span></div>
  <div class="stage" id="stage"></div>
  <div class="pnumber" id="mpage"></div>
  <div class="swipehint" id="shint"></div>
  <div class="foot">
    <button class="undo" id="undo" aria-label="تراجع">&#8630;</button>
    <button class="add" id="add"><b id="cnt">٠</b><span>خطأ</span></button>
    <button id="done">تم</button>
  </div>
  <div class="hintbar" id="hint"></div>
</div>

<script>

const PAGE_STARTS_ENC = '1:1;2:1,6,17,25,30,38,49,58,62,70,77,84,89,94,102,106,113,120,127,135,142,146,154,164,170,177,182,187,191,197,203,211,216,220,225,231,234,238,246,249,253,257,260,265,270,275,282,283;3:1,10,16,23,30,38,46,53,62,71,78,84,92,101,109,116,122,133,141,149,154,158,166,174,181,187,195;4:1,7,12,15,20,24,27,34,38,45,52,60,66,75,80,87,92,95,102,106,114,122,128,135,141,148,155,163,171,176;5:3,6,10,14,18,24,32,37,42,46,51,58,65,71,77,83,90,96,104,109,114;6:1,9,19,28,36,45,53,60,69,74,82,91,95,102,111,119,125,132,138,143,147,152,158;7:1,12,23,31,38,44,52,58,68,74,82,88,96,105,121,131,138,144,150,156,160,164,171,179,188,196;8:1,9,17,26,34,41,46,53,62,70;9:1,7,14,21,27,32,37,41,48,55,62,69,73,80,87,94,100,107,112,118,123;10:1,7,15,21,26,34,43,54,62,71,79,89,98,107;11:6,13,20,29,38,46,54,63,72,82,89,98,109,118;12:5,15,23,31,38,44,53,64,70,79,87,96,104;13:1,6,14,19,29,35,43;14:6,11,19,25,34,43;15:1,16,32,52,71,91;16:7,15,27,35,43,55,65,73,80,88,94,103,111,119;17:1,8,18,28,39,50,59,67,76,87,97,105;18:5,16,21,28,35,46,54,62,75,84,98;19:1,12,26,39,52,65,77,96;20:13,38,52,65,77,88,99,114,126;21:1,11,25,36,45,58,73,82,91,102;22:1,6,16,24,31,39,47,56,65,73;23:1,18,28,43,60,75,90,105;24:1,11,21,28,32,37,44,54,59,62;25:3,12,21,33,44,56,68;26:1,20,40,61,84,112,137,160,184,207;27:1,14,23,36,45,56,64,77,89;28:6,14,22,29,36,44,51,60,71,78,85;29:7,15,24,31,39,46,53,64;30:6,16,25,33,42,51;31:1,12,20,29;32:1,12,21;33:1,7,16,23,31,36,44,51,55,63;34:1,8,15,23,32,40,49;35:4,12,19,31,39,45;36:13,28,41,55,71;37:1,25,52,77,103,127,154;38:1,17,27,43,62,84;39:6,11,22,32,41,48,57,68,75;40:8,17,26,34,41,50,59,67,78;41:1,12,21,30,39,47;42:1,11,16,23,32,45,52;43:11,23,34,48,61,74;44:1,19,40;45:1,14,23,33;46:6,15,21,29;47:1,12,20,30;48:1,10,16,24,29;49:5,12;50:1,16,36;51:7,31,52;52:15,32;53:1,27,45;54:7,28,50;55:17,41,68;56:17,51,77;57:4,12,19,25;58:1,7,12,22;59:4,10,17;60:1,6,12;61:6;62:1,9;63:5;64:1,10;65:1,6;66:1,8;67:1,13,27;68:16,43;69:9,35;70:11,40;71:11;72:1,14;73:1,20;74:18,48;75:20;76:6,26;77:20;78:1,31;79:16;80:1;81:1;82:1;83:7,35;85:1;86:1;87:16;89:1,24;91:1;92:15;95:1;97:1;98:8;100:10;103:1;106:1;109:1;112:1';
// ============================================================
// جدول صفحات مصحف المدينة (٦٠٤ صفحة) — أول آية تبدأ في كل صفحة.
// الترميز: "رقم السورة:آية,آية,...;رقم السورة:..." بترتيب الصفحات.
// كل صفحة في مصحف المدينة تنتهي عند نهاية آية، فلا توجد آية موزعة
// على صفحتين — لذلك يكفي معرفة أول آية في كل صفحة.

// مصفوفة مضغوطة: كل صفحة = رقم السورة * 1000 + رقم الآية (تصاعدية).
const PAGE_STARTS = (() => {
  const out = [];
  for (const seg of PAGE_STARTS_ENC.split(';')) {
    const [s, list] = seg.split(':');
    const sn = +s * 1000;
    for (const a of list.split(',')) out.push(sn + +a);
  }
  return out;
})();

// رقم صفحة الآية (sura = 1..114 برقم السورة، ayah = 1..n)
function pageOfAyah(sura, ayah) {
  const key = sura * 1000 + (ayah || 1);
  let lo = 0, hi = PAGE_STARTS.length - 1, ans = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (PAGE_STARTS[mid] <= key) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return ans + 1;
}

// أرقام صفحات ورد واحد. يقبل الشكلين المستخدمين في التطبيق:
//   { sura, from, to }              → آيات محددة
//   { sura, toSura, range:true }    → نطاق سور كاملة
// suraIdx(name) يرجّع ترتيب السورة (1..114) من ثابت SURAS.
function pagesForAssignment(a, suraIdx, ayahCount) {
  if (!a || !a.sura) return [];
  const s1 = suraIdx(a.sura);
  if (!s1) return [];
  let start, end;
  if (a.range && a.toSura) {
    const s2 = suraIdx(a.toSura);
    if (!s2) return [];
    const lo = Math.min(s1, s2), hi = Math.max(s1, s2);
    start = pageOfAyah(lo, 1);
    end = pageOfAyah(hi, ayahCount(hi));
  } else {
    // الخانتين فاضيتين = السورة كاملة · "من" لوحدها = آية واحدة · "إلى" لوحدها = من أول السورة
    const n = ayahCount(s1);
    const hf = +a.from > 0, ht = +a.to > 0;
    const f = hf ? Math.min(+a.from, n) : 1;
    const t = ht ? Math.min(+a.to, n) : (hf ? f : n);
    start = pageOfAyah(s1, Math.min(f, t));
    end = pageOfAyah(s1, Math.max(f, t));
  }
  if (end < start) { const x = start; start = end; end = x; }
  const out = [];
  for (let p = start; p <= end; p++) out.push(p);
  return out;
}

// صفحات ورد كامل (مصفوفة تكليفات newLoh/newMadi) بدون تكرار ومرتّبة.
function pagesForWard(list, suraIdx, ayahCount) {
  const set = new Set();
  (list || []).forEach(a => pagesForAssignment(a, suraIdx, ayahCount).forEach(p => set.add(p)));
  return [...set].sort((x, y) => x - y);
}

const JUZ_START = [[1,1],[2,142],[2,253],[3,92],[4,24],[4,148],[5,82],[6,111],[7,88],[8,41],
[9,93],[11,6],[12,53],[15,1],[17,1],[18,75],[21,1],[23,1],[25,21],[27,56],
[29,46],[33,31],[36,28],[39,32],[41,47],[46,1],[51,31],[58,1],[67,1],[78,1]];
const JUZ_NAME = ['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر',
'الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر','التاسع عشر','العشرون',
'الحادي والعشرون','الثاني والعشرون','الثالث والعشرون','الرابع والعشرون','الخامس والعشرون','السادس والعشرون','السابع والعشرون','الثامن والعشرون','التاسع والعشرون','الثلاثون'];
const juzOfPage = p => { let n = 1; JUZ_START.forEach((j, i) => { if (pageOfAyah(j[0], j[1]) <= p) n = i + 1; }); return n; };
const suraOfPage = p => SURAS[Math.floor(PAGE_STARTS[p - 1] / 1000) - 1][0];
const AR = n => String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const suraIdx = name => { const i = SURAS.findIndex(x => x[0] === name); return i < 0 ? 0 : i + 1; };
const ayahCount = i => SURAS[i - 1][1];

const sEl = document.getElementById('s'), fEl = document.getElementById('f'), tEl = document.getElementById('t');
SURAS.forEach(([n, c], i) => {
  const o = document.createElement('option');
  o.value = n; o.textContent = (i + 1) + '. ' + n + ' (' + c + ' آية)';
  sEl.appendChild(o);
});
sEl.value = 'النبأ'; fEl.value = 1; tEl.value = 40;

let pages = [], counts = [], idx = 0;
function calc() {
  const a = { sura: sEl.value, from: fEl.value, to: tEl.value };
  const max = ayahCount(suraIdx(a.sura));
  fEl.max = tEl.max = max;
  if (+fEl.value > max) fEl.value = max;
  if (+tEl.value > max) tEl.value = max;
  pages = pagesForWard([{ sura: sEl.value, from: fEl.value, to: tEl.value }], suraIdx, ayahCount);
  document.getElementById('pages').textContent =
    pages.length ? 'الورد ده في ' + (pages.length === 1 ? 'صفحة ' + AR(pages[0]) : AR(pages.length) + ' صفحات: ' + pages.map(AR).join('، ')) : '';
}
sEl.addEventListener('change', () => { fEl.value = 1; tEl.value = ayahCount(suraIdx(sEl.value)); calc(); });
[fEl, tEl].forEach(e => e.addEventListener('input', calc));
calc();

function pad(p) { return String(p).padStart(3, '0'); }

let PAGEDATA = null;
const SRC_W = 1024, MAXK = 1.12;
let FONTMAP = null;
const fontLoaded = new Map();

async function loadFontMap() {
  if (!FONTMAP) FONTMAP = await (await fetch('fontmap.json')).json();
  return FONTMAP;
}
/** Each font covers a run of pages, so a page usually needs one file, and the
 *  file is fetched the first time a page that uses it is opened. */
function loadFont(key) {
  if (!fontLoaded.has(key)) {
    const file = Object.keys(FONTMAP.fonts).find((n) => FONTMAP.fonts[n] === key) || key;
    const ff = new FontFace(key, `url(fonts/v4/${file}${file === 'QCF4_QBSML' ? '' : '_W'}.woff2)`);
    fontLoaded.set(key, ff.load().then((f) => { document.fonts.add(f); }).catch(() => {}));
  }
  return fontLoaded.get(key);
}
async function ensureFontsFor(p) {
  await loadFontMap();
  const keys = (FONTMAP.pages[p] || []).slice();
  if (!keys.includes('bsml')) keys.push('bsml');
  await Promise.all(keys.map(loadFont));
}

const pageCache = new Map();
async function loadPage(p) {
  if (!pageCache.has(p)) {
    pageCache.set(p, fetch(`data/${p}.json`).then((r) => {
      if (!r.ok) throw new Error('page ' + p);
      return r.json();
    }));
  }
  return pageCache.get(p);
}

function fit(sheet) {
  const pad = 8;
  const W = sheet.clientWidth - pad * 2;
  const lines = [...sheet.querySelectorAll('.ln')];
  if (!lines.length) return;
  const segs = [...sheet.querySelectorAll('.seg')];
  const BASE = 40;
  segs.forEach(s => { s.style.transform = 'none'; s.style.width = 'auto'; s.style.textAlign = 'right'; s.style.textAlignLast = 'auto'; s.textContent = decodeURIComponent(s.dataset.tight); s.style.fontSize = BASE + 'px'; });
  const natural = el => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; };
  const boxOf = s => (s.dataset.x1 - s.dataset.x0) / SRC_W * W;
  const placed = segs.filter(s => s.dataset.x0 !== 'null');
  const nat = new Map(segs.map(s => [s, natural(s)]));
  // one size for the page: the size at which the typical segment already fills its printed box
  const ratios = placed.map(s => boxOf(s) / nat.get(s)).sort((a, b) => a - b);
  let size = ratios.length ? Math.floor(BASE * ratios[Math.floor(ratios.length / 2)] * 10) / 10 : 20;
  // never let the widest line spill past the page edge
  const widest = Math.max(...segs.map(s => nat.get(s)));
  size = Math.min(size, Math.floor((BASE * W / widest) * 10) / 10);
  const bs = sheet.querySelector('.bsm');
  const apply = sz => {
    segs.forEach(s => {
      s.style.fontSize = sz + 'px';
      const w = nat.get(s) * sz / BASE;
      if (s.dataset.x0 === 'null') { s.style.right = 'auto'; s.style.left = '0'; s.style.transform = 'none'; return; }
      s.style.right = ((SRC_W - s.dataset.x1) / SRC_W * W) + 'px';
      const box = boxOf(s);
      let k = box / w;
      if (k <= MAXK) {                       // the glyphs alone can fill this line
        s.textContent = decodeURIComponent(s.dataset.tight);
        s.style.width = 'auto'; s.style.textAlign = 'right'; s.style.textAlignLast = 'auto';
        k = Math.max(0.9, Math.min(MAXK, k));
      } else {                               // it cannot: put the spaces back and justify
        s.textContent = decodeURIComponent(s.dataset.loose);
        const r2 = document.createRange(); r2.selectNodeContents(s);
        const wl = r2.getBoundingClientRect().width;
        k = Math.max(0.9, Math.min(MAXK, box / wl));
        s.style.width = (box / k) + 'px';
        s.style.textAlign = 'justify'; s.style.textAlignLast = 'justify';
      }
      if (w * k > W) k = W / w;
      s.style.transform = 'scaleX(' + k.toFixed(3) + ')';
    });
    if (bs) bs.style.fontSize = (sz * 0.95) + 'px';
    lines.forEach(l => { l.style.height = (sz * 2.0) + 'px'; });
  };
  apply(size);
  const avail = document.getElementById('stage').clientHeight - 10;
  let guard = 0;
  while (sheet.scrollHeight > avail && size > 10 && guard++ < 25) {
    size = Math.floor(size * 0.97 * 10) / 10;
    apply(size);
  }
  // spread whatever height is left over the lines
  if (sheet.scrollHeight < avail) {
    const extra = (avail - sheet.scrollHeight) / lines.length;
    lines.forEach(l => { l.style.height = (size * 2.0 + extra) + 'px'; });
    if (sheet.scrollHeight > avail) lines.forEach(l => { l.style.height = (size * 2.0) + 'px'; });
  }
}
async function render() {
  const st = document.getElementById('stage');
  const p = pages[idx];
  label(p);
  st.innerHTML = '<div class="sheet" style="opacity:0"></div>';
  addNav(st);
  try {
    const rows = await loadPage(p);
    await ensureFontsFor(p);
    if (pages[idx] !== p) return;
    const sheet = st.querySelector('.sheet');
    sheet.innerHTML = rows.map(l =>
      l.t === 'h' ? '<div class="hdr"><span style="font-family:' + l.f + '">' + l.c + '</span></div>'
      : l.t === 'b' ? '<div class="bsm" style="font-family:' + l.f + '">' + l.c + '</div>'
      : '<div class="ln"><span class="seg" style="font-family:' + l.f + '" data-x0="' + l.x0 + '" data-x1="' + l.x1
        + '" data-tight="' + encodeURIComponent(l.g) + '" data-loose="' + encodeURIComponent(l.gs) + '">' + l.g + '</span></div>').join('');
    await document.fonts.ready;
    fit(sheet);
    sheet.style.opacity = '1';
  } catch (e) {
    console.error('render failed', e);
    st.innerHTML = '<div class="miss">تعذّر تحميل صفحة ' + AR(p) + '.<br>لو انت أوفلاين، افتحها مرة وانت متصل.</div>';
    addNav(st);
  }
  st.scrollTop = 0;
  total();
}
function addNav(st) {
  if (pages.length < 2) return;
  if (idx > 0) st.insertAdjacentHTML('beforeend', '<button class="nav r" id="prev">&#8250;</button>');
  if (idx < pages.length - 1) st.insertAdjacentHTML('beforeend', '<button class="nav l" id="next">&#8249;</button>');
  const pv = document.getElementById('prev'), nx = document.getElementById('next');
  if (pv) pv.onclick = () => goTo(idx - 1, -1);
  if (nx) nx.onclick = () => goTo(idx + 1, 1);
}
function label(p) {
  document.getElementById('pnum').textContent = pages.length > 1 ? AR(idx + 1) + '/' + AR(pages.length) : '';
  document.getElementById('mjuz').textContent = 'الجزء ' + JUZ_NAME[juzOfPage(p) - 1];
  document.getElementById('msura').textContent = suraOfPage(p);
  document.getElementById('mpage').textContent = AR(p);
}
function total() {
  const t = counts.reduce((a, b) => a + b, 0);
  document.getElementById('cnt').textContent = AR(t);
  document.getElementById('hint').textContent = t === 0 ? 'دوس على زرار الخطأ مع كل غلطة' : 'إجمالي أخطاء الورد ' + AR(t) + (pages.length > 1 ? '، وفي الصفحة دي ' + AR(counts[idx]) : '');
}
// ---- خارجي: يفتح الورد مباشرةً من رابط، ويرجّع العدد للتطبيق ----
const EMBED = (() => {
  const q = new URLSearchParams(location.search);
  const raw = q.get('a');            // sura:from:to,sura:from:to
  if (!raw) return null;
  const items = raw.split(',').map(s => s.split(':')).filter(x => x[0])
    .map(x => ({ sura: decodeURIComponent(x[0]), from: x[1] || '', to: x[2] || '' }));
  if (!items.length) return null;
  return { items, name: q.get('n') || '', ward: q.get('w') || '', token: q.get('id') || '' };
})();
function reportCount(total) {
  if (!EMBED) return false;
  const msg = { type: 'mushaf-count', id: EMBED.token, count: total };
  if (window.parent && window.parent !== window) { window.parent.postMessage(msg, '*'); return true; }
  if (window.opener) { window.opener.postMessage(msg, '*'); return true; }
  return false;
}
function startEmbedded() {
  if (!EMBED) return;
  document.querySelector('.wrap').style.display = 'none';
  pages = pagesForWard(EMBED.items, suraIdx, ayahCount);
  if (!pages.length) return;
  counts = pages.map(() => 0); idx = 0;
  pages.forEach((pp) => ensureFontsFor(pp));
  document.querySelector('.bar .t b').textContent = EMBED.name || 'التسميع';
  const wardText = EMBED.items
    .map(a => a.sura + (a.from && a.to ? ' ' + AR(a.from) + '-' + AR(a.to) : ''))
    .join(' + ');
  document.getElementById('ward').textContent = EMBED.ward ? EMBED.ward + '، ' + wardText : wardText;
  document.getElementById('viewer').classList.add('on');
  render();
}
document.getElementById('go').onclick = () => {
  calc();
  if (!pages.length) return;
  counts = pages.map(() => 0); idx = 0;
  pages.forEach((pp) => ensureFontsFor(pp));
  document.getElementById('ward').textContent = 'اللوح، ' + sEl.value + ' ' + AR(fEl.value) + '-' + AR(tEl.value);
  document.getElementById('viewer').classList.add('on');
  render();
  if (pages.length > 1) flash('اسحب يمين للصفحة اللي بعدها');
};
function flash(msg) {
  const s = document.getElementById('shint');
  s.textContent = msg; s.classList.add('on');
  clearTimeout(s._t); s._t = setTimeout(() => s.classList.remove('on'), 1100);
}
function goTo(n, dir) {
  if (n < 0) { flash('دي أول صفحة في الورد'); return; }
  if (n > pages.length - 1) { flash('دي آخر صفحة في الورد'); return; }
  idx = n; render();
  const img = document.querySelector('.stage .sheet') || document.querySelector('.stage img');
  if (img) {
    img.style.transition = 'none';
    img.style.transform = 'translateX(' + (dir > 0 ? -60 : 60) + 'px)';
    img.style.opacity = '0';
    requestAnimationFrame(() => { img.style.transition = ''; img.style.transform = ''; img.style.opacity = '1'; });
  }
}
(function () {
  const st = document.getElementById('stage');
  let x0 = 0, y0 = 0, dx = 0, dy = 0, active = false;
  st.addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || pages.length < 2) return;
    active = true; dx = dy = 0;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  st.addEventListener('touchmove', e => {
    if (!active) return;
    dx = e.touches[0].clientX - x0;
    dy = e.touches[0].clientY - y0;
    if (Math.abs(dx) > Math.abs(dy) * 1.5 && Math.abs(dx) > 10) {
      st.classList.add('drag');
      const img = st.querySelector('.sheet') || st.querySelector('img');
      if (img) img.style.transform = 'translateX(' + (dx * 0.35) + 'px)';
    }
  }, { passive: true });
  st.addEventListener('touchend', () => {
    if (!active) return;
    active = false;
    st.classList.remove('drag');
    const img = st.querySelector('.sheet') || st.querySelector('img');
    if (img) img.style.transform = '';
    if (Math.abs(dx) > Math.abs(dy) * 1.5 && Math.abs(dx) > 55) {
      if (dx > 0) goTo(idx + 1, 1); else goTo(idx - 1, -1);
    }
  }, { passive: true });
  document.addEventListener('keydown', e => {
    if (!document.getElementById('viewer').classList.contains('on') || pages.length < 2) return;
    if (e.key === 'ArrowLeft') goTo(idx + 1, 1);
    if (e.key === 'ArrowRight') goTo(idx - 1, -1);
  });
})();
document.getElementById('add').onclick = () => { counts[idx]++; total(); };
document.getElementById('undo').onclick = () => { if (counts[idx] > 0) counts[idx]--; total(); };
document.getElementById('close').onclick = () => { if (EMBED) { reportCount(counts.reduce((a,b)=>a+b,0)); return; } document.getElementById('viewer').classList.remove('on'); };
document.getElementById('done').onclick = () => {
  const t = counts.reduce((a, b) => a + b, 0);
  if (reportCount(t)) return;                 // opened from the app: hand the number back
  document.getElementById('viewer').classList.remove('on');
  alert('اتسجّل ' + AR(t) + ' خطأ. في النسخة النهائية الرقم ده هيتحفظ مع الجلسة.');
};
startEmbedded();
</script>
